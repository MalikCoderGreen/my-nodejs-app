version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"
      - npm install
  pre_build:
    commands:
      - echo "Linting app.js for obvious syntax errors"
      - node --check app.js
  build:
    commands:
      - echo "Smoke-testing index.html"
      - echo "Running test suite"
      - npm test
  post_build:
    commands:
      - echo "Build finished"
reports:
  MyReportGroup: # The name or ARN of the Report Group
    files:
      - "results.xml"
    base-directory: "test-results" # Directory containing the test file(s)
    file-format: "JUNITXML" # Options: JUNITXML, CUCUMBERJSON, NUNITXML, TESTNGXML

artifacts:
  files:
    - "**/*"
